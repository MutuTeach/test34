var u8=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})};
var enc=new TextEncoder();
function fecha(iso){var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];var p=iso.split('-');return (+p[2])+' '+m[+p[1]-1]+' '+p[0]}
function dias(iso){var p=iso.split('-');var e=new Date(+p[0],+p[1]-1,+p[2],23,59,59);return Math.floor((e-new Date())/86400000)}
function abrir(K,meta){
  var badge='';
  if(meta.e!=='-'){var d=dias(meta.e);if(d<0)return Promise.reject({exp:meta.e});badge=' · vence '+(d<=0?'hoy':'en '+d+(d===1?' día':' días'));}
  return crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt'])
   .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},k,u8(D.ct))})
   .then(function(gz){if(!('DecompressionStream' in window))throw {old:1};return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()})
   .then(function(buf){
     var html=new TextDecoder().decode(buf);
     var wm='<div style="position:fixed;left:10px;bottom:8px;z-index:9999;font:600 11px/1 -apple-system,Inter,sans-serif;color:rgba(231,200,138,.55);background:rgba(8,9,11,.7);border:1px solid rgba(231,200,138,.2);border-radius:99px;padding:6px 11px;pointer-events:none;letter-spacing:.02em">Acceso personal · '+meta.n.replace(/</g,'')+badge+' · v '+D.v+'</div>';
     html=html.replace(/<\/body>/i, wm+'</body>');
     document.open();document.write(html);document.close();
   });
}
function probar(pw){
  return crypto.subtle.importKey('raw',enc.encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveKey'])
   .then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])})
   .then(function(kek){
     var i=0;
     function sonraki(){
       if(i>=D.slots.length)return Promise.reject({bad:1});
       var s=D.slots[i++];
       return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(s.i)},kek,u8(s.w))
        .then(function(buf){var b=new Uint8Array(buf);var meta=JSON.parse(new TextDecoder().decode(b.slice(32)));return abrir(b.slice(0,32),meta)},sonraki);
     }
     return sonraki();
   });
}
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();var b=document.getElementById('go'),e=document.getElementById('err');
  b.disabled=true;e.textContent='';
  probar(document.getElementById('pw').value).catch(function(x){
    e.textContent = x&&x.exp ? 'Tu clave expiró el '+fecha(x.exp)+'. Escríbeme para renovarla.' : x&&x.old ? 'Tu navegador es muy antiguo. Actualízalo para entrar.' : 'Clave incorrecta.';
    b.disabled=false;
  });
});
